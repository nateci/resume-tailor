name: Daily Resume Tailor

on:
  schedule:
    - cron: "0 13 * * *"   # ~8-9am US Eastern; edit to taste (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: resume-tailor
  cancel-in-progress: false

jobs:
  tailor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install anthropic openpyxl playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Filter new full-time SWE/systems/AI roles
        id: filter
        run: |
          COUNT=$(python scripts/filter_jobs.py)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Fetch descriptions + start-date signals
        if: steps.filter.outputs.count != '0'
        run: python scripts/fetch_descriptions.py

      - name: Tailor, score, rank, build sheet
        if: steps.filter.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/tailor_and_build.py

      - name: Commit results
        run: |
          git config user.name  "resume-tailor-bot"
          git config user.email "actions@github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Ranked tailored resumes: $(date -u +%Y-%m-%d)"
            git push
          fi
